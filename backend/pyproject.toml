[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-intelligent-email-os"
version = "1.0.0"
description = "Self-hosted Personal Intelligent Email OS for Gmail with 3D classification, safe bulk cleanup, pgvector RAG, and Telegram Command Center"
readme = "../README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
