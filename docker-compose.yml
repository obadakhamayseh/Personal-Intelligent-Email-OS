services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: emailos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emailos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emailos_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-emailos_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emailos} -d ${POSTGRES_DB:-emailos_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: emailos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emailos-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-emailos}:${POSTGRES_PASSWORD:-emailos_secure_password}@postgres:5432/${POSTGRES_DB:-emailos_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-emailos}:${POSTGRES_PASSWORD:-emailos_secure_password}@postgres:5432/${POSTGRES_DB:-emailos_db}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emailos-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-emailos}:${POSTGRES_PASSWORD:-emailos_secure_password}@postgres:5432/${POSTGRES_DB:-emailos_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-emailos}:${POSTGRES_PASSWORD:-emailos_secure_password}@postgres:5432/${POSTGRES_DB:-emailos_db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: python -m app.worker

  telegram-bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emailos-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-emailos}:${POSTGRES_PASSWORD:-emailos_secure_password}@postgres:5432/${POSTGRES_DB:-emailos_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-emailos}:${POSTGRES_PASSWORD:-emailos_secure_password}@postgres:5432/${POSTGRES_DB:-emailos_db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    command: python -m app.telegram_bot.bot

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emailos-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "${FRONTEND_PORT:-3005}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
